name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: arduino/setup-arduino-cli@81d310742121c928ea9c8bbd407b4217b432ae02 # v2.0.0
      - name: Install the ESP32 core and libraries
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.11 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli lib install "Adafruit BusIO@1.17.4" "Adafruit GFX Library@1.12.6" "PubSubClient@2.8"
      - name: Calendar parser tests
        run: firmware/test/ics/run.sh
      - name: Bus app parsers (stops, TfL, NextBuses)
        run: firmware/test/bus/run.sh
      - name: Translations
        run: firmware/test/i18n/run.sh
      - name: Books (readers, pager, library, fonts)
        run: firmware/test/ebook/run.sh
      - name: "Games (CrossPlay's rules: Solitaire, Mines, Four in a Row, Chess)"
        run: firmware/test/games/run.sh
      - name: Tutor (exercises and lessons, in every language)
        run: firmware/test/tutor7/run.sh
      - name: Build
        run: ./upload.sh build
      - name: Size
        run: ls -l firmware/sticky-os/build/*.bin
      # Fork only, for trying a branch on a board: the image to flash at 0x0.
      - name: Firmware image
        run: |
          set -euo pipefail
          B=firmware/sticky-os/build
          mkdir -p dist
          ESPTOOL=$(find ~/.arduino15/packages/esp32/tools/esptool_py -name esptool -type f | head -1)
          "$ESPTOOL" --chip esp32s3 merge-bin -o dist/sticky-os-full.bin \
            --flash-mode keep --flash-freq keep --flash-size keep \
            0x0 "$B/sticky-os.ino.bootloader.bin" \
            0x8000 "$B/sticky-os.ino.partitions.bin" \
            0xe000 "$B/boot_app0.bin" \
            0x10000 "$B/sticky-os.ino.bin"
          cp "$B/sticky-os.ino.bin" dist/sticky-os.bin
          (cd dist && sha256sum *.bin > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sticky-os-firmware
          path: dist/
          if-no-files-found: error
          retention-days: 14

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Setup app tests
        working-directory: site
        run: node test/run.mjs
      - name: Build the website
        working-directory: site
        run: |
          python3 -m pip install --quiet pillow
          python3 build.py

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      # The gitleaks CLI itself (MIT), not gitleaks-action: the action needs a paid
      # licence for repositories owned by an organization. Pinned and checksummed.
      - name: Scan the history for secrets (gitleaks)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --verbose --exit-code 1 .
